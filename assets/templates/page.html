<!doctype html>
<html lang="zh-CN"{{THEME_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{FONT_LINK}}
<style>
{{CSS}}
</style>
</head>
<body class="ck-page">
<div class="ck-page-head" style="max-width: {{WIDTH}}px;">
  <h1 class="ck-page-title">{{PAGE_TITLE}}</h1>
  <button class="ck-theme" type="button" id="ck-theme-toggle" aria-label="切换深浅色">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"></path></svg>
    <span>深浅色</span>
  </button>
</div>
<div id="ck-root"></div>
<script>
{{JS}}
</script>
<script>
(function () {
  var specs = {{SPECS}};
  var root = document.getElementById('ck-root');
  root.style.display = 'flex'; root.style.flexDirection = 'column'; root.style.gap = '32px';
  ChartKit.defaults.register = '{{REGISTER}}';
  specs.forEach(function (s) { ChartKit.render(root, s); });
  var btn = document.getElementById('ck-theme-toggle'), html = document.documentElement;
  btn.addEventListener('click', function () {
    var dark = html.getAttribute('data-theme') === 'dark' || (!html.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
